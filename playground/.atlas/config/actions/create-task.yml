type: group
actions:
    - id: slug
      type: shell
      command: echo "{{ .title }}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]'

    - id: id
      type: shell
      command: 'bash "{{ .workspace.path }}/bin/create_id.sh" "{{ .workspace.path }}/tmp/task_id_counter"'

    - id: filename
      type: shell
      command: echo "tasks/{{ .id.output }}_{{ .slug.output }}.md"

    - id: create
      type: shell
      command: |
          cat > "{{ .workspace.path }}/{{ .filename.output }}" <<EOF
          ---
          title: {{ .title }}
          status: {{ if .status }}{{ .status }}{{ else }}todo{{ end }}
          ---
          # {{ .title }}
          EOF

    - type: entry-sync
      path: "{{ .filename.output }}"
