bindings:
    - keys: [a]
      action:
          type: input
          label: "Task name"
          submit: create-task
      description: add
      groups: [screen=tasks]

    - keys: [v]
      action: vi
      description: vim
      ext: md

    - keys: [<leader>t]
      global: true
      action:
          type: formdialog
          title: "Create"
          action:
              type: create-task
              title: "{{ .title }}"
              status: "{{ .status }}"
          fields:
              - name: "title"
                type: "textfield"
                label: "Title"

              - name: "status"
                type: "textfield"
                label: "Status"
